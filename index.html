<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vínculo | Joyas & Recuerdos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-neutral-50 text-neutral-800 antialiased" x-data="store()">

    <!-- BARRA SUPERIOR -->
    <div class="bg-neutral-900 text-neutral-200 text-xs sm:text-sm py-2 px-4 text-center font-medium tracking-wide">
        ✨ Envíos a todo Colombia! Pago Anticipado ($18.000) o Contra Entrega ($20.000) ✨
    </div>

    <!-- NAVEGACIÓN -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md shadow-sm border-b border-neutral-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="w-8 h-8 rounded-full bg-neutral-900 text-white flex items-center justify-center font-bold text-sm">V</span>
                <span class="text-xl font-bold tracking-wider text-neutral-900">VÍNCULO</span>
            </div>
            <button @click="cartOpen = true" class="relative flex items-center gap-2 bg-neutral-100 hover:bg-neutral-200 text-neutral-900 px-4 py-2 rounded-full transition text-sm font-medium">
                <span>Carrito</span>
                <span class="bg-neutral-900 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold" x-text="cartCount">0</span>
            </button>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section class="bg-neutral-100 py-12 sm:py-16 border-b border-neutral-200">
        <div class="max-w-4xl mx-auto px-4 text-center">
            <span class="text-xs uppercase tracking-widest bg-neutral-200 text-neutral-700 px-3 py-1 rounded-full font-semibold">Colección Esencial</span>
            <h1 class="text-3xl sm:text-5xl font-bold text-neutral-900 mt-4 mb-4 tracking-tight">Lleva lo que amas siempre cerca</h1>
            <p class="text-neutral-600 text-sm sm:text-base max-w-xl mx-auto mb-6">Accesorios con miradas personalizadas, cuadros y detalles diseñados con un significado eterno.</p>
            <a href="#catalogo" class="inline-block bg-neutral-900 text-white px-6 py-3 rounded-full font-medium text-sm hover:bg-neutral-800 transition shadow-sm">Ver Catálogo</a>
        </div>
    </section>

    <!-- CONTENIDO PRINCIPAL Y FILTROS -->
    <main id="catalogo" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10" x-data="{ tab: 'Todos', search: '' }">
        
        <!-- BARRA DE FILTROS Y BUSCADOR -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
            <div class="flex flex-wrap gap-2 justify-center">
                <template x-for="cat in categories">
                    <button @click="tab = cat" 
                            :class="tab === cat ? 'bg-neutral-900 text-white shadow-sm' : 'bg-white text-neutral-600 hover:bg-neutral-100 border border-neutral-200'"
                            class="px-4 py-2 rounded-full text-sm font-medium transition" 
                            x-text="cat"></button>
                </template>
            </div>
            <div class="w-full md:w-72">
                <input type="text" x-model="search" placeholder="Buscar productos..." class="w-full px-4 py-2 rounded-full border border-neutral-300 text-sm focus:outline-none focus:ring-2 focus:ring-neutral-900 bg-white">
            </div>
        </div>

        <!-- GRILLA DE PRODUCTOS -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <template x-for="product in filteredProducts(tab, search)" :key="product.id">
                <div class="bg-white rounded-2xl border border-neutral-200 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col justify-between">
                    <div>
                        <div class="relative h-64 bg-neutral-100 overflow-hidden">
                            <img :src="product.image" :alt="product.name" class="w-full h-full object-cover">
                            <span class="absolute top-3 left-3 bg-white/90 backdrop-blur-md text-neutral-900 text-xs px-3 py-1 rounded-full font-medium shadow-sm" x-text="product.category"></span>
                        </div>
                        <div class="p-4">
                            <h3 class="font-semibold text-neutral-900 text-base mb-1" x-text="product.name"></h3>
                            <p class="text-neutral-500 text-xs mb-3 line-clamp-2" x-text="product.description"></p>
                            <span class="text-neutral-900 font-bold text-lg" x-text="formatPrice(product.price)"></span>
                        </div>
                    </div>
                    <div class="p-4 pt-0">
                        <button @click="addToCart(product)" class="w-full bg-neutral-900 text-white py-2.5 rounded-xl text-sm font-medium hover:bg-neutral-800 transition flex items-center justify-center gap-2">
                            <span>Agregar al Carrito</span>
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </main>

    <!-- CARRITO LATERAL (MODAL) -->
    <div x-show="cartOpen" class="fixed inset-0 z-50 overflow-hidden" style="display: none;">
        <div class="absolute inset-0 bg-neutral-900/50 backdrop-blur-sm" @click="cartOpen = false"></div>
        <div class="absolute inset-y-0 right-0 max-w-full flex">
            <div class="w-screen max-w-md bg-white shadow-xl flex flex-col">
                <div class="p-6 border-b border-neutral-200 flex items-center justify-between">
                    <h2 class="text-lg font-bold text-neutral-900">Tu Carrito</h2>
                    <button @click="cartOpen = false" class="text-neutral-400 hover:text-neutral-600 text-xl font-bold">✕</button>
                </div>
                <div class="flex-1 overflow-y-auto p-6 space-y-4">
                    <template x-if="cart.length === 0">
                        <p class="text-neutral-500 text-center py-10 text-sm">Tu carrito está vacío.</p>
                    </template>
                    <template x-for="item in cart" :key="item.id">
                        <div class="flex items-center justify-between border-b border-neutral-100 pb-4">
                            <div>
                                <h4 class="font-medium text-sm text-neutral-900" x-text="item.name"></h4>
                                <span class="text-xs text-neutral-500" x-text="formatPrice(item.price)"></span>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="text-sm font-semibold" x-text="item.quantity"></span>
                                <button @click="removeFromCart(item.id)" class="text-red-500 text-xs hover:underline">Eliminar</button>
                            </div>
                        </div>
                    </template>
                </div>
                <div class="p-6 border-t border-neutral-200 bg-neutral-50">
                    <div class="flex justify-between mb-4 font-semibold text-neutral-900">
                        <span>Total:</span>
                        <span x-text="formatPrice(cartTotal)"></span>
                    </div>
                    <button @click="checkoutWhatsApp" class="w-full bg-neutral-900 text-white py-3 rounded-xl font-medium text-sm hover:bg-neutral-800 transition text-center block">
                        Finalizar Pedido por WhatsApp
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- LOGICA DE LA TIENDA -->
    <script>
        function store() {
            return {
                cartOpen: false,
                categories: ['Todos', 'Joyas de Miradas', 'Cuadros Personalizados', 'Llaveros e Imanes', 'Velas & Eventos'],
                products: [
                    { id: 1, name: 'Collar con Mirada Personalizada', category: 'Joyas de Miradas', price: 35000, slug: 'collar-mirada', image: 'https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?q=80&w=600&auto=format&fit=crop', description: 'Inmortaliza la mirada de esa persona especial o mascota en un dije delicado con resina.', customizable: true },
                    { id: 2, name: 'Pulsera Ajustable de Ojo Personalizado', category: 'Joyas de Miradas', price: 28000, slug: 'pulsera-mirada', image: 'https://images.unsplash.com/photo-1611591470671-3078415ab55e?q=80&w=600&auto=format&fit=crop', description: 'Manilla fina de hilo neutro con el centro de la mirada elegida. Llévalo siempre contigo.', customizable: true },
                    { id: 3, name: 'Cuadro Minimalista en Blanco y Negro', category: 'Cuadros Personalizados', price: 45000, slug: 'cuadro-minimalista', image: 'https://images.unsplash.com/photo-1513519245088-0e12902e5a38?q=80&w=600&auto=format&fit=crop', description: 'Cuadro personalizado con tu foto favorita en diseño limpio y elegante estilo galería.', customizable: true },
                    { id: 4, name: 'Llavero con Inicial y Relieve', category: 'Llaveros e Imanes', price: 18000, slug: 'llavero-inicial', image: 'https://images.unsplash.com/photo-1629198688000-71f23e745b6e?q=80&w=600&auto=format&fit=crop', description: 'Llavero sobrio en tonos grises o negros con inicial personalizada y detalle minimalista.', customizable: true },
                    { id: 5, name: 'Set de Velas Aromáticas para Eventos (Min. 20 u.)', category: 'Velas & Eventos', price: 12000, slug: 'velas-eventos', image: 'https://images.unsplash.com/photo-1603006905003-be475563bc59?q=80&w=600&auto=format&fit=crop', description: 'Velas de soya natural en envase sobrio con etiqueta personalizada para matrimonios, grados o marcas.', customizable: true }
                ],
                cart: [],
                filteredProducts(tab, search) {
                    return this.products.filter(p => {
                        let matchesCategory = (tab === 'Todos' || p.category === tab);
                        let matchesSearch = p.name.toLowerCase().includes(search.toLowerCase()) || p.description.toLowerCase().includes(search.toLowerCase());
                        return matchesCategory && matchesSearch;
                    });
                },
                addToCart(product) {
                    let existing = this.cart.find(item => item.id === product.id);
                    if (existing) {
                        existing.quantity++;
                    } else {
                        this.cart.push({ ...product, quantity: 1 });
                    }
                    this.cartOpen = true;
                },
                removeFromCart(id) {
                    this.cart = this.cart.filter(item => item.id !== id);
                },
                get cartCount() {
                    return this.cart.reduce((sum, item) => sum + item.quantity, 0);
                },
                get cartTotal() {
                    return this.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                },
                formatPrice(value) {
                    return '$ ' + value.toLocaleString('es-CO');
                },
                checkoutWhatsApp() {
                    let phone = '573000000000'; // Reemplaza con tu número de WhatsApp
                    let text = "¡Hola! Vínculo ✨ Me gustaría hacer el siguiente pedido:\n\n";
                    this.cart.forEach(item => {
                        text += `- ${item.quantity}x ${item.name} ($ ${item.price.toLocaleString('es-CO')})\n`;
                    });
                    text += `\n*Total a pagar:* $ ${this.cartTotal.toLocaleString('es-CO')}`;
                    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');
                }
            }
        }
    </script>
</body>
</html>
